<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Progress</title>

    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/progress.css">
    <link rel="stylesheet" href="css/field.css">
    <link rel="stylesheet" href="css/switch.css">
</head>

<body>
    <main class="app">
        <h1 class="app__title">Progress</h1>

        <div class="app__progress" id="progress-container"></div>

        <div class="app__controls">
            <label class="field">
                <input class="field__input" id="value" type="text" inputmode="decimal" autocomplete="off" maxlength="6"
                    enterkeyhint="done">
                <span class="field__label">Value</span>
            </label>

            <label class="switch">
                <input class="switch__input" id="animate" type="checkbox" role="switch" autocomplete="off">
                <span class="switch__label">Animate</span>
            </label>

            <label class="switch">
                <input class="switch__input" id="hide" type="checkbox" role="switch" autocomplete="off">
                <span class="switch__label">Hide</span>
            </label>
        </div>
    </main>

    <script type="module" src="js/app.js"></script>
</body>

</html>
